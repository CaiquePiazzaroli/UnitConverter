<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <style>
        body { 
            font-family: 'Comic Sans MS', cursive, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
        }
        .card { 
            background: white;
            border: 3px solid #000; 
            border-radius: 15px; 
            padding: 30px; 
            width: 400px; 
            box-shadow: 8px 8px 0px #000;
        }
        h2 { margin-top: 0; font-size: 28px; }
        .tabs { 
            display: flex; 
            gap: 20px; 
            margin-bottom: 25px; 
            border-bottom: 2px solid #eee; 
            padding-bottom: 10px; 
        }
        .tab { 
            cursor: pointer; 
            font-weight: bold; 
            color: #888; 
            font-size: 18px;
            transition: 0.2s;
        }
        .tab.active { 
            color: #2563eb; 
            text-decoration: underline; 
            text-underline-offset: 8px;
        }
        .field { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 16px; }
        input, select { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid #000; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-family: inherit;
            font-size: 16px;
        }
        button { 
            background: white; 
            border: 2px solid #000; 
            padding: 12px 25px; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 8px; 
            font-family: inherit;
            font-size: 16px;
            transition: transform 0.1s;
        }
        button:active { transform: translateY(2px); }
        button:hover { background: #f0f0f0; }

        /* Estilos do Resultado */
        #result-container { display: none; }
        .result-value { 
            font-size: 32px; 
            font-weight: bold; 
            margin: 30px 0; 
            color: #000;
        }
    </style>
</head>
<body>

    <div class="card" id="form-card">
        <h2>Unit Converter</h2>
        <div class="tabs">
            <span class="tab" id="tab-length" onclick="setUnit('length')">Length</span>
            <span class="tab" id="tab-weight" onclick="setUnit('weight')">Weight</span>
            <span class="tab" id="tab-temperature" onclick="setUnit('temperature')">Temperature</span>
        </div>

        <form id="converterForm">
            <input type="hidden" id="unitInput" name="unit" value="length">

            <div class="field">
                <label id="label-value">Enter the value to convert</label>
                <input type="number" name="value" step="any" placeholder="0.00" required>
            </div>

            <div class="field">
                <label>Unit to Convert from</label>
                <select id="fromSelect" name="from" required></select>
            </div>

            <div class="field">
                <label>Unit to Convert to</label>
                <select id="toSelect" name="to" required></select>
            </div>

            <button type="submit">Convert</button>
        </form>
    </div>

    <div class="card" id="result-container">
        <h2>Unit Converter</h2>
        <div class="tabs">
            <span class="tab active" id="res-tab-label">Length</span>
        </div>
        <p style="color: #666;">Result of your calculation</p>
        <div class="result-value" id="result-display">20 ft = 609cm</div>
        <button onclick="resetForm()">Reset</button>
    </div>

<script>
    const unitsData = {
        length: ["CM", "METRE", "KM"],
        weight: ["TONNE", "GRAM", "KILOGRAM"],
        temperature: ["FAHRENHEIT", "CELSIUS", "KELVIN"]
    };

    // Função para mudar a categoria (Length, Weight, Temperature)
    function setUnit(category) {
        // 1. Atualiza visual das abas
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        const activeTab = document.getElementById('tab-' + category);
        if(activeTab) activeTab.classList.add('active');
        
        // 2. Atualiza o valor que será enviado no JSON
        document.getElementById('unitInput').value = category;
        
        // 3. Atualiza o texto da label de entrada (opcional, para ficar igual ao mockup)
        document.getElementById('label-value').innerText = `Enter the ${category} to convert`;

        // 4. Limpa e preenche os selects 'from' e 'to'
        const fromSelect = document.getElementById('fromSelect');
        const toSelect = document.getElementById('toSelect');
        
        fromSelect.innerHTML = "";
        toSelect.innerHTML = "";

        unitsData[category].forEach(unit => {
            fromSelect.options.add(new Option(unit, unit));
            toSelect.options.add(new Option(unit, unit));
        });
    }

    // Inicializa a página com 'length'
    setUnit('length');

    // Manipulação do envio do formulário
    const form = document.getElementById("converterForm");
    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        
        // IMPORTANTE: Converter o valor para número para o JSON ficar correto
        data.value = parseFloat(data.value);

        try {
            const response = await fetch('http://localhost:8001/conversions', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify(data)
            });

            if (!response.ok) throw new Error("Erro na resposta do servidor");

            const resultJson = await response.json();
            
            // Alterna para a tela de resultado
            showResult(data, resultJson.result);
                
        } catch (error) {
            alert("Erro: Não foi possível conectar à API. Verifique se o servidor Java está rodando e com o CORS configurado.");
            console.error(error);
        }
    });

    function showResult(requestData, resultValue) {
        document.getElementById('form-card').style.display = 'none';
        document.getElementById('result-container').style.display = 'block';
        
        // Atualiza a aba do resultado
        document.getElementById('res-tab-label').innerText = requestData.unit.charAt(0).toUpperCase() + requestData.unit.slice(1);
        
        // Formata a string do resultado: "100 CELSIUS = 212,00 FAHRENHEIT"
        document.getElementById('result-display').innerText = 
            `${requestData.value} ${requestData.from} = ${resultValue} ${requestData.to}`;
    }

    function resetForm() {
        document.getElementById('form-card').style.display = 'block';
        document.getElementById('result-container').style.display = 'none';
        form.reset();
        setUnit('length'); // Volta ao padrão
    }
</script>
</body>
</html>
